name: Benchmark paired diagnostic

on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Exact reviewed diagnostic commit
        required: true
        type: string

permissions:
  contents: read

env:
  EXPECTED_COMMIT: ${{ inputs.expected_commit }}
  CARGO_INCREMENTAL: 0
  CARGO_BUILD_JOBS: 2
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  PYTHONDONTWRITEBYTECODE: 1

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      manifest_sha256: ${{ steps.build.outputs.manifest_sha256 }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact diagnostic source
        run: |
          python3 - <<'PY'
          import os, re, subprocess
          expected = os.environ['EXPECTED_COMMIT']
          assert re.fullmatch(r'[0-9a-f]{40}', expected)
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() == expected == os.environ['GITHUB_SHA']
          assert not subprocess.check_output(['git', 'status', '--porcelain', '--untracked-files=all'], text=True)
          PY
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master, explicit toolchain below
        with:
          toolchain: 1.98.1
      - name: Install build prerequisites
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - name: Pure diagnostic controls
        run: python3 -m unittest discover -s scripts/ci -p 'test_benchmark_pair.py' -v
      - name: Build exact variants without running them
        id: build
        run: python3 scripts/ci/benchmark_pair.py build --root "$RUNNER_TEMP/benchmark-pair-build"
      - name: Retain build evidence and executables
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: benchmark-pair-build-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/benchmark-pair-build/payload/
          if-no-files-found: error

  measure:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Start outer clock before checkout and download
        run: |
          python3 - <<'PYTHON'
          import json, os, time
          from pathlib import Path
          started = time.monotonic()
          deadline = started + 27 * 60
          # Reserve three minutes for cleanup/upload. Provider setup before this
          # first executable step is outside this clock and is not measured here.
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'PAIR_OUTER_DEADLINE={deadline}\n')
          Path(os.environ['RUNNER_TEMP'], 'benchmark-pair-clock.json').write_text(
              json.dumps({'first_step_monotonic': started, 'outer_deadline_monotonic': deadline,
                          'measurement_budget_seconds': 1440, 'receipt_reserve_seconds': 180}) + '\n')
          PYTHON
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Verify exact diagnostic source
        run: |
          python3 - <<'PY'
          import os, re, subprocess
          expected = os.environ['EXPECTED_COMMIT']
          assert re.fullmatch(r'[0-9a-f]{40}', expected)
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() == expected == os.environ['GITHUB_SHA']
          assert not subprocess.check_output(['git', 'status', '--porcelain', '--untracked-files=all'], text=True)
          PY
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: benchmark-pair-build-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/benchmark-pair-payload
      - name: One sequential full pair on this host
        env:
          MANIFEST_SHA256: ${{ needs.build.outputs.manifest_sha256 }}
        run: |
          python3 scripts/ci/benchmark_pair.py measure \
            --payload "$RUNNER_TEMP/benchmark-pair-payload" \
            --manifest-sha256 "$MANIFEST_SHA256" \
            --outer-deadline "$PAIR_OUTER_DEADLINE" \
            --root "$RUNNER_TEMP/benchmark-pair-measurement"
      - name: Retain samples and terminal receipts on success or failure
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: benchmark-pair-measurement-${{ github.run_id }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/benchmark-pair-measurement/
            ${{ runner.temp }}/benchmark-pair-clock.json
          if-no-files-found: error
