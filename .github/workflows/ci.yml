# Disposable explicit-bind diagnostic; never merge this workflow replacement.
name: Explicit bind acceptance
on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Full reviewed diagnostic commit
        type: string
        required: true
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EXPECTED_COMMIT: ${{ inputs.expected_commit }}
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact source before preparation
        run: |
          python3 - <<'PY'
          import os, re, subprocess
          expected = os.environ['EXPECTED_COMMIT']
          assert re.fullmatch('[0-9a-f]{40}', expected)
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() == expected
          assert not subprocess.check_output(['git', 'status', '--porcelain'])
          PY
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: 1.95.0
      - name: Install build dependencies outside runtime namespace
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config
          cargo fetch --locked
          rustc --version --verbose
      - name: Build exact baseline and fixed test binaries without execution
        run: python3 scripts/ci/explicit-bind-acceptance.py prepare
      - name: Run bounded baseline and fixed cases in separate private namespaces
        run: python3 scripts/ci/explicit-bind-acceptance.py run
      - name: Collect only reviewed evidence paths
        id: collect
        if: always()
        run: python3 scripts/ci/explicit-bind-acceptance.py collect
      - uses: actions/upload-artifact@v4
        if: always() && steps.collect.outcome == 'success'
        with:
          name: explicit-bind-${{ github.run_id }}
          path: ${{ runner.temp }}/explicit-bind-upload/
          if-no-files-found: error
          retention-days: 14
